<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bambu H2D Dashboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --fg: #e6e8ec; --muted: #8a93a3;
    --accent: #4ade80; --warn: #f59e0b; --err: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 16px 24px; display: flex; align-items: baseline; gap: 12px;
    border-bottom: 1px solid #222;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); display: inline-block;
  }
  header .dot.ok { background: var(--accent); }
  header .dot.bad { background: var(--err); }
  main {
    display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
    gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border-radius: 12px; padding: 16px;
    border: 1px solid #222;
  }
  .cam {
    padding: 0; overflow: hidden; aspect-ratio: 16/9;
    display: flex; align-items: center; justify-content: center; background: #000;
  }
  .cam img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .job { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .job-name { font-size: 18px; font-weight: 600; margin-bottom: 12px; word-break: break-all; }
  .state {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 12px; background: #2b313c; color: var(--muted);
  }
  .state.running { background: rgba(74, 222, 128, 0.15); color: var(--accent); }
  .state.pause { background: rgba(245, 158, 11, 0.15); color: var(--warn); }
  .state.failed { background: rgba(239, 68, 68, 0.15); color: var(--err); }
  .progress {
    width: 100%; height: 8px; background: #2b313c; border-radius: 999px;
    overflow: hidden; margin: 14px 0 6px;
  }
  .progress-bar {
    height: 100%; background: var(--accent); width: 0%;
    transition: width 0.4s ease;
  }
  .progress-meta {
    display: flex; justify-content: space-between; font-size: 13px;
    color: var(--muted); margin-bottom: 16px;
  }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: #11141a; padding: 10px 12px; border-radius: 8px; }
  .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .value { font-size: 18px; font-weight: 600; margin-top: 2px; }
  .stat .sub { font-size: 12px; color: var(--muted); }
  .err {
    margin-top: 12px; padding: 8px 12px; border-radius: 8px;
    background: rgba(239, 68, 68, 0.1); color: var(--err); font-size: 13px;
    display: none;
  }
  .err.show { display: block; }
  .ams { margin-top: 16px; }
  .ams h2 {
    margin: 0 0 8px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
  }
  .ams-unit {
    background: #11141a; border-radius: 8px; padding: 10px 12px;
    margin-bottom: 8px;
  }
  .ams-unit-head {
    display: flex; justify-content: space-between; font-size: 12px;
    color: var(--muted); margin-bottom: 8px;
  }
  .ams-trays { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tray {
    position: relative; aspect-ratio: 1; border-radius: 6px;
    background: #2b313c; overflow: hidden; border: 2px solid transparent;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .tray.empty { opacity: 0.35; }
  .tray.active { border-color: var(--accent); }
  .tray-fill {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--tray-color, #555); transition: height 0.3s ease;
  }
  .tray-label {
    position: relative; z-index: 1; font-size: 10px; font-weight: 600;
    color: #fff; text-shadow: 0 0 4px rgba(0,0,0,0.8);
    padding: 0 0 4px;
  }
  .tray-type {
    position: absolute; top: 4px; left: 4px; z-index: 1;
    font-size: 9px; color: #fff; text-shadow: 0 0 4px rgba(0,0,0,0.8);
    font-weight: 600;
  }
  section.timelapses {
    max-width: 1400px; margin: 0 auto; padding: 0 16px 32px;
  }
  section.timelapses h2 {
    margin: 8px 0 12px; font-size: 14px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .tl-grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .tl-card {
    background: var(--panel); border: 1px solid #222; border-radius: 10px;
    overflow: hidden; cursor: pointer; transition: transform 0.15s ease;
  }
  .tl-card:hover { transform: translateY(-2px); border-color: #333; }
  .tl-thumb {
    aspect-ratio: 16/9; background: #000;
    display: flex; align-items: center; justify-content: center;
    color: #555; font-size: 12px;
  }
  .tl-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tl-meta { padding: 10px 12px; }
  .tl-name {
    font-size: 13px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tl-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .tl-empty {
    grid-column: 1 / -1; color: var(--muted); font-size: 13px;
    padding: 16px; text-align: center; background: var(--panel);
    border-radius: 10px; border: 1px solid #222;
  }
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100;
    display: none; align-items: center; justify-content: center;
    padding: 24px;
  }
  .lightbox.show { display: flex; }
  .lightbox-inner {
    position: relative; max-width: 95vw; max-height: 95vh;
    background: #000; border-radius: 8px; overflow: hidden;
  }
  .lightbox video { max-width: 95vw; max-height: 85vh; display: block; }
  .lightbox-title {
    position: absolute; top: 8px; left: 12px; color: #fff;
    background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px;
    font-size: 12px; pointer-events: none;
  }
  .lightbox-close {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.6); color: #fff; border: 0; border-radius: 50%;
    width: 32px; height: 32px; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox-actions {
    background: #11141a; padding: 10px 12px;
    display: flex; align-items: center; gap: 8px; font-size: 13px;
    flex-wrap: wrap;
  }
  .lightbox-actions label {
    color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; font-weight: 600;
  }
  .lightbox-actions input[type="url"] {
    flex: 1; min-width: 240px; background: #1d2128;
    border: 1px solid #2d323c; color: var(--fg);
    padding: 6px 8px; border-radius: 4px; font: inherit;
  }
  .lightbox-actions button {
    background: #2d323c; color: var(--fg); border: 0; border-radius: 4px;
    padding: 6px 12px; cursor: pointer; font: inherit;
  }
  .lightbox-actions button.primary { background: var(--accent); color: #000; font-weight: 600; }
  .lightbox-actions a.open-link {
    color: var(--accent); text-decoration: none; padding: 6px 8px;
  }
  .lightbox-actions a.open-link:hover { text-decoration: underline; }
  .tl-thumb { position: relative; }
  .tl-link {
    position: absolute; top: 6px; right: 6px; z-index: 1;
    background: rgba(0,0,0,0.7); color: var(--accent);
    border-radius: 4px; padding: 3px 7px; font-size: 11px;
    text-decoration: none; font-weight: 600;
  }
  .tl-link:hover { background: rgba(0,0,0,0.9); }
  .tl-failed-chip {
    position: absolute; top: 6px; left: 6px; z-index: 1;
    background: rgba(0,0,0,0.7); color: var(--err);
    border-radius: 4px; padding: 3px 7px; font-size: 11px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .tl-thumb.failed {
    box-shadow: inset 0 0 0 3px var(--err);
  }
</style>
</head>
<body>
<header>
  <h1>Bambu H2D</h1>
  <span class="dot" id="conn"></span>
  <span id="conn-text" style="color: var(--muted); font-size: 13px;">connecting…</span>
</header>
<main>
  <div class="panel cam">
    <img id="cam" src="/stream.mjpg" alt="printer camera">
  </div>
  <div class="panel">
    <div class="job">CURRENT JOB</div>
    <div class="job-name" id="job">—</div>
    <span class="state" id="state">UNKNOWN</span>
    <span id="stage" style="margin-left: 8px; font-size: 12px; color: var(--muted);"></span>

    <div class="progress"><div class="progress-bar" id="bar"></div></div>
    <div class="progress-meta">
      <span id="pct">0%</span>
      <span id="remaining">—</span>
    </div>

    <div class="stats" id="stats">
      <div class="stat" id="stat-nozzle">
        <div class="label" id="nozzle-label">Nozzle</div>
        <div class="value" id="nozzle">—</div>
        <div class="sub" id="nozzle-target"></div>
      </div>
      <div class="stat" id="stat-nozzle-2" style="display:none">
        <div class="label">Nozzle R</div>
        <div class="value" id="nozzle2">—</div>
        <div class="sub" id="nozzle2-target"></div>
      </div>
      <div class="stat">
        <div class="label">Bed</div>
        <div class="value" id="bed">—</div>
        <div class="sub" id="bed-target"></div>
      </div>
      <div class="stat">
        <div class="label">Chamber</div>
        <div class="value" id="chamber">—</div>
      </div>
      <div class="stat">
        <div class="label">Layer</div>
        <div class="value" id="layer">—</div>
      </div>
    </div>

    <div class="err" id="err"></div>

    <div class="ams" id="ams-section" style="display:none">
      <h2>AMS</h2>
      <div id="ams-units"></div>
    </div>
  </div>
</main>

<section class="timelapses" id="timelapses-section" hidden>
  <h2>Timelapses</h2>
  <div class="tl-grid" id="tl-grid"></div>
</section>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <div class="lightbox-inner">
    <div class="lightbox-title" id="lightbox-title"></div>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <video id="lightbox-video" controls preload="metadata"></video>
    <div class="lightbox-actions">
      <label for="lightbox-url">Model link</label>
      <input type="url" id="lightbox-url" placeholder="https://makerworld.com/... (optional)">
      <a class="open-link" id="lightbox-open" href="#" target="_blank" rel="noopener" hidden>Open ↗</a>
      <button id="lightbox-save" class="primary">Save</button>
      <label style="display: flex; align-items: center; gap: 6px; color: var(--err); cursor: pointer; user-select: none">
        <input type="checkbox" id="lightbox-failed">
        Failed
      </label>
      <span id="lightbox-status" style="color: var(--muted); font-size: 12px"></span>
    </div>
  </div>
</div>

<script>
function fmtTemp(v) { return v == null ? "—" : `${Math.round(v)}°C`; }
function fmtTarget(v) { return v == null || v === 0 ? "" : `→ ${Math.round(v)}°C`; }
function fmtRemaining(min) {
  if (min == null) return "—";
  if (min <= 0) return "done";
  const h = Math.floor(min / 60);
  const m = min % 60;
  return h ? `${h}h ${m}m remaining` : `${m}m remaining`;
}

async function tick() {
  try {
    const r = await fetch("/api/status");
    const data = await r.json();
    const conn = document.getElementById("conn");
    const connText = document.getElementById("conn-text");
    conn.className = "dot " + (data.connected ? "ok" : "bad");
    connText.textContent = data.connected ? "connected" : "disconnected";

    const s = data.summary || {};
    document.getElementById("job").textContent = s.job || "—";

    const state = (s.state || "UNKNOWN").toUpperCase();
    const stateEl = document.getElementById("state");
    stateEl.textContent = state;
    stateEl.className = "state " + (
      state === "RUNNING" ? "running" :
      state === "PAUSE" ? "pause" :
      state === "FAILED" ? "failed" : ""
    );

    const pct = s.progress ?? 0;
    document.getElementById("bar").style.width = pct + "%";
    document.getElementById("pct").textContent = pct + "%";
    document.getElementById("remaining").textContent = fmtRemaining(s.remaining_min);

    document.getElementById("stage").textContent = s.stage_label ? `· ${s.stage_label}` : "";

    const nozzles = s.nozzles || [{ temp: s.nozzle_temp, target: s.nozzle_target }];
    // Display order: physical left first, right second. The MQTT array indexes
    // are swapped relative to physical position, so nozzles[1] is left.
    const left = nozzles.length > 1 ? nozzles[1] : nozzles[0];
    const right = nozzles.length > 1 ? nozzles[0] : null;
    document.getElementById("nozzle-label").textContent = right ? "Nozzle L" : "Nozzle";
    document.getElementById("nozzle").textContent = fmtTemp(left?.temp);
    document.getElementById("nozzle-target").textContent = fmtTarget(left?.target);
    const n2 = document.getElementById("stat-nozzle-2");
    if (right) {
      n2.style.display = "";
      document.getElementById("nozzle2").textContent = fmtTemp(right.temp);
      document.getElementById("nozzle2-target").textContent = fmtTarget(right.target);
    } else {
      n2.style.display = "none";
    }

    document.getElementById("bed").textContent = fmtTemp(s.bed_temp);
    document.getElementById("bed-target").textContent = fmtTarget(s.bed_target);
    document.getElementById("chamber").textContent = fmtTemp(s.chamber_temp);

    if (s.layer != null && s.total_layers != null) {
      document.getElementById("layer").textContent = `${s.layer} / ${s.total_layers}`;
    } else {
      document.getElementById("layer").textContent = "—";
    }

    const err = document.getElementById("err");
    if (s.error && s.error !== 0) {
      err.textContent = "Printer error code: " + s.error;
      err.classList.add("show");
    } else {
      err.classList.remove("show");
    }

    renderAms(s.ams);
  } catch (e) {
    document.getElementById("conn").className = "dot bad";
    document.getElementById("conn-text").textContent = "dashboard offline";
  }
}

function renderAms(ams) {
  const section = document.getElementById("ams-section");
  const root = document.getElementById("ams-units");
  const units = ams && ams.units ? ams.units : [];
  if (units.length === 0 && !(ams && ams.external && !ams.external.empty)) {
    section.style.display = "none";
    return;
  }
  section.style.display = "block";

  const activeTray = ams.active_tray != null ? parseInt(ams.active_tray, 10) : -1;
  const html = units.map(unit => {
    const headBits = [];
    if (unit.humidity != null) headBits.push(`humidity ${unit.humidity}/5`);
    if (unit.temp != null) headBits.push(`${unit.temp}°C`);
    const head = headBits.join(" · ") || "";
    const trays = (unit.trays || []).map(t => {
      const globalId = (unit.id ?? 0) * 4 + (t.id ?? 0);
      const active = globalId === activeTray;
      const remain = t.remain != null && t.remain >= 0 ? t.remain : null;
      const fill = t.empty ? 0 : (remain != null ? remain : 100);
      const color = t.color || "#555";
      const cls = ["tray"];
      if (t.empty) cls.push("empty");
      if (active) cls.push("active");
      const label = t.empty ? "" : (remain != null ? `${remain}%` : "?");
      const typeLabel = t.empty ? "" : (t.type || "");
      return `
        <div class="${cls.join(" ")}" style="--tray-color: ${color}">
          <div class="tray-type">${typeLabel}</div>
          <div class="tray-fill" style="height: ${fill}%; background: ${color}"></div>
          <div class="tray-label">${label}</div>
        </div>`;
    }).join("");
    return `
      <div class="ams-unit">
        <div class="ams-unit-head">
          <span>AMS ${unit.id ?? "?"}</span>
          <span>${head}</span>
        </div>
        <div class="ams-trays">${trays}</div>
      </div>`;
  }).join("");

  let extraHtml = "";
  if (ams.external && !ams.external.empty) {
    const t = ams.external;
    const remain = t.remain != null && t.remain >= 0 ? `${t.remain}%` : "loaded";
    const active = activeTray === 254;
    extraHtml = `
      <div class="ams-unit">
        <div class="ams-unit-head">
          <span>External spool</span>
          <span>${t.type || ""}</span>
        </div>
        <div class="ams-trays" style="grid-template-columns: 1fr">
          <div class="tray${active ? ' active' : ''}" style="--tray-color: ${t.color || '#555'}; aspect-ratio: 4/1">
            <div class="tray-fill" style="height: 100%; background: ${t.color || '#555'}"></div>
            <div class="tray-label">${remain}</div>
          </div>
        </div>
      </div>`;
  }

  root.innerHTML = html + extraHtml;
}

function fmtBytes(n) {
  if (n == null) return "";
  const u = ["B", "KB", "MB", "GB"];
  let i = 0; let v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(v >= 10 || i === 0 ? 0 : 1)} ${u[i]}`;
}
function fmtDate(s) {
  const d = new Date(s * 1000);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleString();
}

async function loadTimelapses() {
  try {
    const r = await fetch("/api/timelapses");
    const data = await r.json();
    const items = data.items || [];
    const section = document.getElementById("timelapses-section");
    const grid = document.getElementById("tl-grid");
    if (items.length === 0) {
      section.hidden = true;
      grid.innerHTML = "";
      return;
    }
    section.hidden = false;
    grid.innerHTML = items.map(it => {
      const thumb = it.thumbnail
        ? `<img src="/timelapses/thumbnail/${encodeURIComponent(it.thumbnail)}" alt="" loading="lazy">`
        : "no thumbnail";
      const link = it.url
        ? `<a class="tl-link" href="${escapeAttr(it.url)}" target="_blank" rel="noopener" title="${escapeAttr(it.url)}">model ↗</a>`
        : "";
      const failedChip = it.failed ? `<span class="tl-failed-chip">failed</span>` : "";
      const thumbClass = it.failed ? "tl-thumb failed" : "tl-thumb";
      return `
        <div class="tl-card" data-name="${encodeURIComponent(it.name)}" data-title="${escapeAttr(it.name)}" data-url="${escapeAttr(it.url || '')}" data-failed="${it.failed ? '1' : ''}">
          <div class="${thumbClass}">${thumb}${failedChip}${link}</div>
          <div class="tl-meta">
            <div class="tl-name" title="${escapeAttr(it.name)}">${it.name}</div>
            <div class="tl-sub">${fmtDate(it.mtime)} · ${fmtBytes(it.size)}</div>
          </div>
        </div>`;
    }).join("");
  } catch (e) {
    // leave panel as-is on transient errors
  }
}

function escapeAttr(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

let currentTimelapse = null; // { name, title }

function openTimelapse(name, title, url, failed) {
  currentTimelapse = { name, title };
  const lb = document.getElementById("lightbox");
  const video = document.getElementById("lightbox-video");
  video.src = "/timelapses/" + name;
  document.getElementById("lightbox-title").textContent = title;
  const input = document.getElementById("lightbox-url");
  input.value = url || "";
  updateOpenLink(url || "");
  document.getElementById("lightbox-failed").checked = !!failed;
  document.getElementById("lightbox-status").textContent = "";
  lb.classList.add("show");
  video.play().catch(() => { /* user can click play */ });
}
function updateOpenLink(url) {
  const a = document.getElementById("lightbox-open");
  if (url && /^https?:\/\//i.test(url)) {
    a.href = url;
    a.hidden = false;
  } else {
    a.hidden = true;
  }
}
function closeLightbox() {
  const lb = document.getElementById("lightbox");
  const video = document.getElementById("lightbox-video");
  video.pause();
  video.removeAttribute("src");
  video.load();
  lb.classList.remove("show");
  currentTimelapse = null;
}

async function saveTimelapseUrl() {
  if (!currentTimelapse) return;
  const url = document.getElementById("lightbox-url").value.trim();
  const status = document.getElementById("lightbox-status");
  status.textContent = "saving…";
  try {
    const r = await fetch(`/api/timelapses/${currentTimelapse.name}/url`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    });
    const data = await r.json();
    if (!r.ok) {
      status.textContent = data.error || "failed";
      return;
    }
    status.textContent = "saved";
    updateOpenLink(data.url || "");
    loadTimelapses();  // refresh grid so card shows the chip
  } catch (e) {
    status.textContent = "error";
  }
}

document.getElementById("tl-grid").addEventListener("click", e => {
  // Don't open the lightbox if the user clicked the model link chip.
  if (e.target.closest(".tl-link")) {
    e.stopPropagation();
    return;
  }
  const card = e.target.closest(".tl-card");
  if (!card) return;
  openTimelapse(card.dataset.name, card.dataset.title, card.dataset.url, card.dataset.failed === "1");
});
document.getElementById("lightbox-save").addEventListener("click", saveTimelapseUrl);
document.getElementById("lightbox-url").addEventListener("input", e => {
  updateOpenLink(e.target.value.trim());
});
document.getElementById("lightbox-failed").addEventListener("change", async e => {
  if (!currentTimelapse) return;
  const status = document.getElementById("lightbox-status");
  status.textContent = "saving…";
  try {
    const r = await fetch(`/api/timelapses/${currentTimelapse.name}/failed`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ failed: e.target.checked })
    });
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      status.textContent = data.error || "failed";
      e.target.checked = !e.target.checked;  // revert
      return;
    }
    status.textContent = "saved";
    loadTimelapses();
  } catch (err) {
    status.textContent = "error";
    e.target.checked = !e.target.checked;
  }
});
document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
document.getElementById("lightbox").addEventListener("click", e => {
  if (e.target.id === "lightbox") closeLightbox();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLightbox();
});

loadTimelapses();
setInterval(loadTimelapses, 30000);

document.getElementById("cam").addEventListener("error", () => {
  setTimeout(() => {
    document.getElementById("cam").src = "/stream.mjpg?t=" + Date.now();
  }, 2000);
});

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
